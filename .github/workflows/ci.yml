name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-lint-build:
    name: Client — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: http://localhost:8800/api
